<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="三层架构：训练进程、参数服务器、存储层">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b1d"/>
      <stop offset="1" stop-color="#101416"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37b3a4"/>
      <stop offset="1" stop-color="#128274"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37b3a4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2a45c"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="464" height="464" rx="30" fill="url(#panel)" stroke="#2a3134" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- 计算层 -->
    <rect x="76" y="62" width="328" height="100" rx="14" fill="#1a2022" stroke="#2d3538"/>
    <text x="96" y="86" font-size="10" letter-spacing="2" fill="#7f8f96">TRAIN PROC</text>
    <rect x="96" y="98" width="78" height="44" rx="8" fill="#20282b" stroke="#39444a"/>
    <text x="135" y="125" font-size="9.5" fill="#9fb0b6" text-anchor="middle">model</text>
    <rect x="186" y="98" width="78" height="44" rx="8" fill="#20282b" stroke="#39444a"/>
    <text x="225" y="125" font-size="9.5" fill="#9fb0b6" text-anchor="middle">op</text>
    <rect x="276" y="98" width="108" height="44" rx="8" fill="#14332f" stroke="#2c6f66"/>
    <text x="330" y="125" font-size="9.5" fill="#8fd8cd" text-anchor="middle">client</text>

    <!-- 下行的读请求 -->
    <path d="M225 162 L225 214" stroke="#37b3a4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
    <text x="234" y="194" font-size="9" letter-spacing="1" fill="#5fb9ac">GET</text>

    <!-- 参数服务器层 -->
    <rect x="76" y="214" width="328" height="100" rx="14" fill="#1a2022" stroke="#2d3538"/>
    <text x="96" y="238" font-size="10" letter-spacing="2" fill="#7f8f96">PARAM SERVER</text>
    <g>
      <rect x="96" y="250" width="34" height="46" rx="6" fill="#20282b" stroke="#39444a"/>
      <rect x="140" y="250" width="34" height="46" rx="6" fill="#20282b" stroke="#39444a"/>
      <rect x="184" y="250" width="34" height="46" rx="6" fill="#20282b" stroke="#39444a"/>
      <rect x="228" y="250" width="34" height="46" rx="6" fill="#20282b" stroke="#39444a"/>
      <text x="113" y="290" font-size="8" fill="#6f7d83" text-anchor="middle">s0</text>
      <text x="157" y="290" font-size="8" fill="#6f7d83" text-anchor="middle">s1</text>
      <text x="201" y="290" font-size="8" fill="#6f7d83" text-anchor="middle">s2</text>
      <text x="245" y="290" font-size="8" fill="#6f7d83" text-anchor="middle">s3</text>
    </g>
    <circle cx="330" cy="272" r="24" fill="#2a2118" stroke="#7a5a2e"/>
    <text x="330" y="276" font-size="9" fill="#e2a45c" text-anchor="middle">opt</text>

    <!-- 上行的梯度 -->
    <path d="M333 314 L333 366" stroke="#e2a45c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
    <text x="272" y="346" font-size="9" letter-spacing="1" fill="#c9924e">UPDATE</text>

    <!-- 存储层 -->
    <rect x="76" y="366" width="328" height="86" rx="14" fill="#1a2022" stroke="#2d3538"/>
    <text x="96" y="390" font-size="10" letter-spacing="2" fill="#7f8f96">STORE</text>
    <g fill="#20282b" stroke="#39444a">
      <rect x="96" y="400" width="30" height="18" rx="4"/>
      <rect x="132" y="400" width="30" height="18" rx="4"/>
      <rect x="168" y="400" width="30" height="18" rx="4"/>
      <rect x="204" y="400" width="30" height="18" rx="4"/>
      <rect x="240" y="400" width="30" height="18" rx="4"/>
      <rect x="276" y="400" width="30" height="18" rx="4"/>
      <rect x="312" y="400" width="30" height="18" rx="4"/>
      <rect x="348" y="400" width="30" height="18" rx="4"/>
      <rect x="96" y="424" width="66" height="18" rx="4" fill="#14332f" stroke="#2c6f66"/>
      <rect x="168" y="424" width="66" height="18" rx="4"/>
      <rect x="276" y="424" width="102" height="18" rx="4" fill="#2a2118" stroke="#7a5a2e"/>
    </g>
    <text x="129" y="437" font-size="8.5" fill="#8fd8cd" text-anchor="middle">index</text>
    <text x="327" y="437" font-size="8.5" fill="#c9924e" text-anchor="middle">value</text>

    <!-- 密钥小节 -->
    <g fill="#5fb9ac" opacity="0.75">
      <rect x="456" y="118" width="5" height="5" rx="1"/>
      <rect x="456" y="132" width="5" height="5" rx="1"/>
      <rect x="456" y="146" width="5" height="5" rx="1"/>
    </g>
    <g fill="#c9924e" opacity="0.75">
      <rect x="20" y="300" width="5" height="5" rx="1"/>
      <rect x="20" y="314" width="5" height="5" rx="1"/>
      <rect x="20" y="328" width="5" height="5" rx="1"/>
    </g>
  </g>
</svg>
